# Field metadata only. The names and descriptions the user reads live in
# strings.json under "services", which is what Home Assistant translates: left
# here they would stay English whatever language the user runs.
broadcast:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hermes
    message:
      required: true
      example: "Alert: motion detected in the garden"
      selector:
        text:
          multiline: true
    channel:
      required: false
      example: 1
      selector:
        number:
          mode: box
          min: 0
          max: 7

send_direct:
  fields:
    config_entry_id:
      required: true
      selector:
        config_entry:
          integration: hermes
    node_id:
      required: true
      example: 3771721320
      selector:
        number:
          mode: box
          min: 0
    message:
      required: true
      selector:
        text:
          multiline: true
